name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI has no production secrets, so the build runs against placeholders rather
  # than SKIP_ENV_VALIDATION. That way env validation is actually exercised on
  # every PR — a malformed schema fails here instead of at deploy time.
  # None of these reach a real service: the build renders pages, it does not
  # connect to anything.
  NODE_ENV: production
  NEXT_PUBLIC_APP_URL: https://app.eventos.my
  NEXT_PUBLIC_APP_NAME: EventOS
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: eventos-public
  SUPABASE_SECRET_KEY: ci-placeholder-secret-key
  DATABASE_URL: postgresql://ci:ci@localhost:6543/postgres
  DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Check for a test environment
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::E2E_SUPABASE_URL is not set — end-to-end tests were SKIPPED, not passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.run == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.guard.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: steps.guard.outputs.run == 'true'
        env:
          E2E_LIVE_SUPABASE: "true"
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          NEXT_PUBLIC_APP_NAME: EventOS
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.E2E_DIRECT_DATABASE_URL }}
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
